; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = receiver

[env]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib @ ^6.6.0

; ==========================================================
; TRANSMITTER — TEMPLATE (multi-nó)
; Todos os nós usam o mesmo transmitter.cpp, compilado com um
; NODE_ID único (1-254, identifica o nó físico) e um NODE_TYPE
; (DEVICE_TYPE_CISTERN ou DEVICE_TYPE_TANK, define se o pacote
; carrega pump_status). Para adicionar um novo nó (RNF04),
; basta duplicar um dos [env:...] abaixo com um NODE_ID livre.
; ==========================================================

[env:transmitter_cistern_01]
build_src_filter = +<*.cpp> -<receiver.cpp> -<radio_rx.cpp> -<bt.cpp> -<main.cpp>
build_flags =
    -DNODE_ID=1
    -DNODE_TYPE=DEVICE_TYPE_CISTERN
lib_deps =
    ${env.lib_deps}
    sparkfun/SparkFun VL53L1X 4m Laser Distance Sensor @ ^1.2.9

[env:transmitter_tank_01]
build_src_filter = +<*.cpp> -<receiver.cpp> -<radio_rx.cpp> -<bt.cpp> -<main.cpp>
build_flags =
    -DNODE_ID=2
    -DNODE_TYPE=DEVICE_TYPE_TANK
lib_deps =
    ${env.lib_deps}
    sparkfun/SparkFun VL53L1X 4m Laser Distance Sensor @ ^1.2.9

[env:transmitter_tank_02]
build_src_filter = +<*.cpp> -<receiver.cpp> -<radio_rx.cpp> -<bt.cpp> -<main.cpp>
build_flags =
    -DNODE_ID=3
    -DNODE_TYPE=DEVICE_TYPE_TANK
lib_deps =
    ${env.lib_deps}
    sparkfun/SparkFun VL53L1X 4m Laser Distance Sensor @ ^1.2.9

; Adicione quantos [env:transmitter_...] forem necessários,
; sempre com um NODE_ID diferente dos demais.

; ==========================================================
; RECEIVER / GATEWAY (Bridge)
; Único firmware — roteia os pacotes de todos os nós pelo
; campo TelemetryData.node_type, encaminhando o schema BLE
; correspondente.
; ==========================================================
[env:receiver]
build_src_filter = +<*.cpp> -<transmitter.cpp> -<radio_tx.cpp> -<sensors.cpp> -<main.cpp>
build_flags = -Wextra -Wall -Wno-unused-parameter
lib_deps =
    ${env.lib_deps}